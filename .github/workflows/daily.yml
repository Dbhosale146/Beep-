name: daily refresh

on:
  schedule:
    # 01:30 UTC = 07:00 IST, so the data is fresh when students wake up.
    - cron: "30 1 * * *"
  workflow_dispatch:        # manual trigger from the Actions tab

permissions:
  contents: write           # to commit the refreshed data files
  pages: write              # to deploy the frontend
  id-token: write           # required by actions/deploy-pages

# Never let two runs deploy at once, but do not cancel a run in progress:
# cancelling mid-commit could leave the data files half written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

      # continue-on-error on purpose. If the pipeline fails we still want to
      # rebuild and redeploy the site from the PREVIOUS committed jobs.json,
      # so a bad API day does not take the page down. The run is marked failed
      # at the end of the job so the failure is still visible.
      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        working-directory: backend
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.run

      # Committing the data is what refreshes the deployed API: the API reads
      # these files from the repo, and a push to main makes the host redeploy
      # it. The frontend is a separate deploy and only needs rebuilding when
      # its own code changes, but rebuilding daily costs nothing.
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/jobs.json backend/data/run_meta.json \
                  backend/data/tag_cache.json backend/data/usage_log.jsonl
          # --quiet exits non-zero when there is nothing staged, which is the
          # normal case if the pipeline failed. Do not fail the job for that.
          if git diff --cached --quiet; then
            echo "no data changes to commit"
          else
            git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # VITE_API_BASE is baked into the bundle at build time, because a static
      # site has no server to read env vars at runtime.
      #
      # Leave it unset and the published page searches the dataset that
      # "npm run build" copies into the bundle -- so Pages alone is a complete,
      # working, daily-refreshing site with no server to deploy or keep awake.
      #
      # Set it (Settings > Secrets and variables > Actions > Variables) to a
      # deployed API including /api, e.g. https://xxx.onrender.com/api, and the
      # same page talks to that instead. Nothing else changes.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.API_BASE_URL }}
          # Also baked in at build time. Leave it unset and the published page
          # has no Google sign-in configured, so the login wall cannot be
          # passed -- set it as an Actions *variable* (it is a public client
          # id, not a secret).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$VITE_API_BASE" ]; then
            echo "API_BASE_URL not set - building in static mode (searches the bundled dataset)."
          else
            echo "Building against API: $VITE_API_BASE"
          fi
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::warning::VITE_GOOGLE_CLIENT_ID not set - the deployed page will have no Google sign-in."
          fi
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - uses: actions/deploy-pages@v4

      # Deploy happened above, so now surface a pipeline failure.
      - name: Fail if the pipeline step failed
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "Pipeline failed; the site was redeployed with the previous data."
          exit 1
